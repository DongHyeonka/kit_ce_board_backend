server:
    port: 4000

spring:
    profiles:
        default: local
    
    application:
        name: kit_ce_board
    
    config:
        import:
            - security/application-db.yml
            - security/application-mail.yml
    
    servlet:
        multipart:
            max-file-size: 5MB
            max-request-size: 5MB

management:
    server:
        port: 4001
    info:
        java:
            enabled: true
        os:
            enabled: true
        env:
            enabled: true
    endpoints:
        enabled-by-default: false
        web:
            exposure:
                include: info, health, prometheus
        jmx:
            exposure:
                exclude: '*'
    endpoint:
        info:
            enabled: true
        health:
            enabled: true
        prometheus:
            enabled: true

#JWT Secret Key 설정
secret:
    key: ${jwt.secret.key}

#file upload path
file:
    path: C://Users//samsung//Desktop//kumoh_board_backend//kumoh_board_backend//fileUpload # 나중에 수정 필요
    url: http://localhost:4000/file/
